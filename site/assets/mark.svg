<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Twinmap</title>
  <!-- The mark in its materials: bronze ring and points, blue disc, ivory screens. For the icon of the app and wherever colour is allowed. -->
  <defs>
    <linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfb08a"/><stop offset=".45" stop-color="#85613f"/><stop offset="1" stop-color="#583e2a"/></linearGradient>
    <radialGradient id="bl" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#2798ba"/><stop offset=".55" stop-color="#105171"/><stop offset="1" stop-color="#062235"/></radialGradient>
    <linearGradient id="iv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2dd"/><stop offset=".6" stop-color="#eacba4"/><stop offset="1" stop-color="#cfb08a"/></linearGradient>
    <mask id="gap"><rect width="64" height="64" fill="#fff"/><rect x="18" y="22" width="46" height="37" rx="5.500" fill="#000"/></mask>
  </defs>
  <g fill="url(#br)" stroke="#342218" stroke-width=".8">
    <path d="M32 0 37.500 6.500H26.500ZM32 64 37.500 57.500H26.500Z"/>
    <path d="M32 1.300 35.900 6.500H28.100Z" transform="rotate(48.500 32 32)"/>
    <path d="M32 1.300 35.900 6.500H28.100Z" transform="rotate(131.500 32 32)"/>
    <path d="M32 1.300 35.900 6.500H28.100Z" transform="rotate(228.500 32 32)"/>
    <path d="M32 1.300 35.900 6.500H28.100Z" transform="rotate(311.500 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="23" fill="url(#bl)"/>
  <circle cx="32" cy="32" r="24.600" stroke="url(#br)" stroke-width="5"/>
  <!-- Thirty-five notches round the ring. -->
  <circle cx="32" cy="32" r="24.600" stroke="#fff2dd" stroke-opacity=".55" stroke-width="1.400" stroke-dasharray="1 3.416"/>
  <circle cx="32" cy="32" r="22.100" stroke="#342218" stroke-width=".8"/>
  <circle cx="32" cy="32" r="27.100" stroke="#342218" stroke-width=".8"/>
  <g transform="translate(13.400 13.700) scale(.58)">
    <rect x="5" y="9" width="38" height="29" rx="3.500" stroke="url(#iv)" stroke-width="3.500" mask="url(#gap)"/>
    <path fill="url(#iv)" stroke="#342218" stroke-width=".9" stroke-linejoin="round" paint-order="stroke" fill-rule="evenodd" d="M24.500 25h31a3.500 3.500 0 0 1 3.500 3.500v22a3.500 3.500 0 0 1-3.500 3.500h-31a3.500 3.500 0 0 1-3.500-3.500v-22a3.500 3.500 0 0 1 3.500-3.500ZM48.600 29 44.800 50 40.700 41.600 31.400 41.600Z"/>
  </g>
