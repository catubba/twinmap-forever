# The Cloudflare Worker behind api.twinmap.app.
#   test:    node --test server/src/index.test.ts
#   publish: npx wrangler@4 deploy            (from this folder)
#   secret:  npx wrangler@4 secret put GITHUB_TOKEN
#            npx wrangler@4 secret put ADMIN_TOKEN    (for /kept: who has it may list and read the bucket)
#   rules:   a file named rules in the bucket narrows what is taken, with nothing published again (Rules in src/index.ts)
name = "twinmap-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "api.twinmap.app", custom_domain = true }]

[vars]
INBOX = "catubba/twinmap-inbox"
DAILY = "3000" # samples taken in a day from everyone (a sample is 51 KB on average, 200 KB at the most); 0 takes none
MAP_DAILY = "100" # of them, from one dungeon: this many where the place was found, and as many where it was not
LOG_DAILY = "1000" # sessions of the addon's log taken in a day from everyone (a session is 200 KB at the most, a few hundred bytes as a rule); 0 takes none
ERRORS_DAILY = "2000" # reports of the app's health taken in a day from everyone (a few kilobytes each, one every half hour at most from an app); 0 takes none

# About five messages a minute from one address. Cloudflare counts loosely: a quick burst gets
# some fifteen through before the refusals start (seen on 15 November 2026).
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60

# Samples of the participation programme: a hundred a minute from one address, one run's worth.
[[ratelimits]]
name = "SAMPLE_LIMIT"
namespace_id = "1002"

[ratelimits.simple]
limit = 100
period = 60

# No cron here: the hour of the prices is a Worker of its own, with no address (server/prices/cron.ts). Empty, so a
# publish takes away the cron this Worker had for a moment (21 November 2026).
[triggers]
crons = []

# The prices of the auction houses are not in this Worker: the hourly Action (prices.yml) writes them to a bucket of
# their own, public, that the app reads straight from prices.twinmap.app. Made with:
#   npx wrangler@4 r2 bucket create twinmap-prices
#   npx wrangler@4 r2 bucket domain add twinmap-prices --domain prices.twinmap.app --zone-id <zone of twinmap.app> --min-tls 1.2
#   npx wrangler@4 r2 bucket lifecycle add twinmap-prices days prices/ --expire-days 8
# and a Cache Rule on twinmap.app: hostname prices.twinmap.app, eligible for cache, edge TTL from the file's
# Cache-Control. The Action writes with an R2 token limited to that bucket (secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY).

# The bucket is in the EU and deletes what is older than twelve months:
#   npx wrangler@4 r2 bucket create twinmap-samples --jurisdiction eu
#   npx wrangler@4 r2 bucket lifecycle add twinmap-samples year --expire-days 365 --jurisdiction eu
[[r2_buckets]]
binding = "SAMPLES"
bucket_name = "twinmap-samples"
jurisdiction = "eu"
