name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  app-mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run dist:mac
      # Hosted runners cannot get Screen Recording without writing the protected permission database, so this job builds and checks the app but does not capture.
      - name: Verify macOS bundle and capture helper
        run: |
          codesign --verify --deep --strict dist/mac-arm64/Twinmap.app
          helper=dist/mac-arm64/Twinmap.app/Contents/Helpers/twinmap-capture
          test -f "$helper"
          test "$(lipo -archs "$helper")" = arm64

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test server/src/index.test.ts
      - run: node --test server/prices/prices.test.ts

  addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: addon/package-lock.json
      - run: npm ci
      - run: npm test
