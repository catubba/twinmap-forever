name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Does this push or pull request touch the app? The Mac build waits for a macOS runner, which GitHub does not
  # always have: it runs only when the app or this file changed. A required check that is skipped counts as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No base to compare with (a new branch, a forced push): build it.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            app=true
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(app/|\.github/workflows/ci\.yml$)'; then
            app=true
          else
            app=false
          fi
          echo "app changed: $app"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  app-mac:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run dist:mac
      # Hosted runners cannot get Screen Recording without writing the protected permission database, so this job builds and checks the app but does not capture.
      - name: Verify macOS bundle, capture helper and update file
        run: |
          codesign --verify --deep --strict dist/mac-arm64/Twinmap.app
          helper=dist/mac-arm64/Twinmap.app/Contents/Helpers/twinmap-capture
          test -f "$helper"
          test "$(lipo -archs "$helper")" = arm64
          # What the app reads to update itself (build/app-update-mac.yml).
          grep -qx 'repo: twinmap-forever' dist/mac-arm64/Twinmap.app/Contents/Resources/app-update.yml

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test server/src/index.test.ts
      - run: node --test server/prices/prices.test.ts

  addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: addon/package-lock.json
      - run: npm ci
      - run: npm test
