name: Release

# A tag like v0.1.0 makes a release: the installer is built with that version, published with the
# two files the app needs to update itself, and sent to VirusTotal; the addon goes to CurseForge.
# A version with a dash in it (v0.1.0-rc.1) is published as a pre-release, which the app does not
# update to and CurseForge does not get.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The notes of a release are the section of its version in CHANGELOG.md. A release without one
      # stops here, before anything is built; a pre-release may go without.
      - name: Read the notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          awk -v v="$VERSION" '/^## /{p=($2==v);next} p' ../CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            case "$VERSION" in
              *-*) echo "Pre-release of $VERSION" > notes.md ;;
              *) echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1 ;;
            esac
          fi

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Build the installer
        run: |
          npx electron-vite build
          npx electron-builder --win nsis --publish never -c.extraMetadata.version="$VERSION"

      # The installer, its blockmap and the file that names the latest version: the app updates itself only with all three.
      - name: Publish the release
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          UPDATE_FILES=$(ls dist/*.yml | grep -v builder-)
          gh release create "$GITHUB_REF_NAME" --title "Twinmap $VERSION" --notes-file notes.md $PRE \
            "dist/Twinmap-Setup-$VERSION.exe" "dist/Twinmap-Setup-$VERSION.exe.blockmap" $UPDATE_FILES

      # The result goes into the release notes, and into virustotal.json for the badge of the README and of the site.
      # A scan that fails does not take the release back: it is published already.
      - name: Scan the installer with VirusTotal
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::warning::VT_API_KEY is not set: the installer was not scanned"
            exit 0
          fi
          node scripts/virustotal.js "dist/Twinmap-Setup-$VERSION.exe" dist/vt
          gh release upload "$GITHUB_REF_NAME" dist/vt/virustotal.json --clobber
          { gh release view "$GITHUB_REF_NAME" --json body -q .body; echo; cat dist/vt/virustotal.md; } > dist/vt/notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file dist/vt/notes.md

      # shields.io does not read a badge's file from a release, so the latest result also lives on a
      # branch of its own, with nothing else on it. A pre-release does not move the badge.
      - name: Publish the result for the badge
        continue-on-error: true
        run: |
          case "$VERSION" in *-*) exit 0 ;; esac
          [ -f dist/vt/virustotal.json ] || exit 0
          WORK=$(mktemp -d)
          cp dist/vt/virustotal.json "$WORK/"
          cd "$WORK"
          git init -q -b badges
          git add virustotal.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "VirusTotal result of $GITHUB_REF_NAME"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

      # The addon goes to CurseForge with the same version and the same notes, in the same zip a player would unpack into
      # AddOns, the two license files inside. A pre-release stays on GitHub. An upload that fails does
      # not take the release back.
      - name: Upload the addon to CurseForge
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          case "$VERSION" in *-*) exit 0 ;; esac
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::warning::CF_API_TOKEN or CF_PROJECT_ID is not set: the addon was not uploaded to CurseForge"
            exit 0
          fi
          mkdir -p dist/addon/TwinmapForever
          cp ../addon/TwinmapForever/* dist/addon/TwinmapForever/
          cp ../LICENSE dist/addon/TwinmapForever/LICENSE.txt
          cp ../THIRD-PARTY-LICENSES dist/addon/TwinmapForever/THIRD-PARTY-LICENSES.txt
          (cd dist/addon && 7z a -tzip "TwinmapForever-$VERSION.zip" TwinmapForever > /dev/null)
          node scripts/curseforge.js "dist/addon/TwinmapForever-$VERSION.zip" ../addon/TwinmapForever/TwinmapForever.toc "$VERSION" notes.md
