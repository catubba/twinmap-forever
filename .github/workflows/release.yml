name: Release

# A tag like v0.1.0 makes a release: the installer is built with that version, published with the
# two files the app needs to update itself, and sent to VirusTotal; the addon goes into the same release,
# for addon managers that install from GitHub (CurseBreaker, WowUp), and to CurseForge.
# A version with a dash in it (v0.1.0-rc.1) is published as a pre-release, which the app does not
# update to and CurseForge does not get.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write # the release reads the CI runs of its commit, and starts Mac app

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # A release is published only from a commit of main whose CI passed: the jobs of ci.yml, the addon's
      # and the server's tests among them, are not run again here. The tag usually lands while that run is
      # still going, so wait for it. A pre-release may be cut from anywhere.
      - name: Wait for a green CI on main for this commit
        run: |
          case "$GITHUB_REF_NAME" in *-*) exit 0 ;; esac
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main" \
              --jq '.workflow_runs | if length == 0 then "none/" else (max_by(.run_started_at) | "\(.status)/\(.conclusion // "")") end') || state="unreadable/"
            case "$state" in
              completed/success) echo "CI on main is green for $GITHUB_SHA"; exit 0 ;;
              completed/*) echo "::error::CI on main did not pass ($state) for $GITHUB_SHA"; exit 1 ;;
              none/*) echo "::error::No CI run on main for $GITHUB_SHA: tag a commit of main"; exit 1 ;;
            esac
            echo "CI on main is $state for $GITHUB_SHA, waiting ($attempt of 60)"
            sleep 20
          done
          echo "::error::CI on main is still running for $GITHUB_SHA after 20 minutes"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The notes of a release are the section of its version in CHANGELOG.md. A release without one
      # stops here, before anything is built; a pre-release may go without.
      - name: Read the notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          awk -v v="$VERSION" '/^## /{p=($2==v);next} p' ../CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            case "$VERSION" in
              *-*) echo "Pre-release of $VERSION" > notes.md ;;
              *) echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1 ;;
            esac
          fi

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Build the installer
        run: |
          npx electron-vite build
          npx electron-builder --win nsis --publish never -c.extraMetadata.version="$VERSION"

      # The addon in the zip a player would unpack into AddOns, the two license files inside, and release.json beside it.
      # release.json is the BigWigs packager's manifest: CurseBreaker and WowUp read it to pick the zip for the Forever
      # client, and with it they never take the installer for the addon. It goes into every release, so the newest
      # release always has the addon, and a release of the addon alone never becomes the latest one that the app updates from.
      - name: Package the addon
        run: |
          mkdir -p dist/addon/TwinmapForever
          cp ../addon/TwinmapForever/* dist/addon/TwinmapForever/
          cp ../LICENSE dist/addon/TwinmapForever/LICENSE.txt
          cp ../THIRD-PARTY-LICENSES dist/addon/TwinmapForever/THIRD-PARTY-LICENSES.txt
          (cd dist/addon && 7z a -tzip "TwinmapForever-$VERSION.zip" TwinmapForever > /dev/null)
          node -e '
            const [toc, version, out] = process.argv.slice(1)
            const line = require("fs").readFileSync(toc, "utf8").match(/^## Interface:(.*)$/m)
            if (!line) throw new Error(toc + " has no ## Interface line")
            const metadata = line[1].split(",").map((s) => ({ flavor: "forever", interface: Number(s.trim()) }))
            const release = { name: "Twinmap Forever", version, filename: "TwinmapForever-" + version + ".zip", nolib: false, metadata }
            require("fs").writeFileSync(out, JSON.stringify({ releases: [release] }))
          ' ../addon/TwinmapForever/TwinmapForever.toc "$VERSION" dist/addon/release.json
          cat dist/addon/release.json

      # The installer, its blockmap and the file that names the latest version: the app updates itself only with all three.
      - name: Publish the release
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          UPDATE_FILES=$(ls dist/*.yml | grep -v builder-)
          # The installer once more under a name with no version in it: the address of the latest one is then always
          # the same (releases/latest/download/Twinmap-Setup.exe), for the site and the README to link the download itself.
          cp "dist/Twinmap-Setup-$VERSION.exe" dist/Twinmap-Setup.exe
          gh release create "$GITHUB_REF_NAME" --title "Twinmap $VERSION" --notes-file notes.md $PRE \
            "dist/Twinmap-Setup-$VERSION.exe" "dist/Twinmap-Setup-$VERSION.exe.blockmap" $UPDATE_FILES dist/Twinmap-Setup.exe \
            "dist/addon/TwinmapForever-$VERSION.zip" dist/addon/release.json

      # The Mac app comes from markus-barta's fork about twenty minutes after the release (mac-app.yml): started
      # here, Mac app waits for it and attaches it as soon as it is there. Its schedule stays as the fallback.
      # A pre-release gets no Mac app.
      - name: Start Mac app
        continue-on-error: true
        run: |
          case "$VERSION" in *-*) exit 0 ;; esac
          gh workflow run mac-app.yml -R "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME" -f wait=60

      # The result goes into the release notes, and into virustotal.json for the badge of the README and of the site.
      # A scan that fails does not take the release back: it is published already.
      - name: Scan the installer with VirusTotal
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::warning::VT_API_KEY is not set: the installer was not scanned"
            exit 0
          fi
          node scripts/virustotal.js "dist/Twinmap-Setup-$VERSION.exe" dist/vt
          gh release upload "$GITHUB_REF_NAME" dist/vt/virustotal.json --clobber
          { gh release view "$GITHUB_REF_NAME" --json body -q .body; echo; cat dist/vt/virustotal.md; } > dist/vt/notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file dist/vt/notes.md

      # shields.io does not read a badge's file from a release, so the latest result also lives on a
      # branch of its own, with nothing else on it. A pre-release does not move the badge.
      - name: Publish the result for the badge
        continue-on-error: true
        run: |
          case "$VERSION" in *-*) exit 0 ;; esac
          [ -f dist/vt/virustotal.json ] || exit 0
          WORK=$(mktemp -d)
          cp dist/vt/virustotal.json "$WORK/"
          cd "$WORK"
          git init -q -b badges
          git add virustotal.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "VirusTotal result of $GITHUB_REF_NAME"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

      # The addon goes to CurseForge with the same version and the same notes, in the same zip a player would unpack into
      # AddOns, the two license files inside. A pre-release stays on GitHub. An upload that fails does
      # not take the release back.
      - name: Upload the addon to CurseForge
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          case "$VERSION" in *-*) exit 0 ;; esac
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::warning::CF_API_TOKEN or CF_PROJECT_ID is not set: the addon was not uploaded to CurseForge"
            exit 0
          fi
          node scripts/curseforge.js "dist/addon/TwinmapForever-$VERSION.zip" ../addon/TwinmapForever/TwinmapForever.toc "$VERSION" notes.md

  # The Linux app, built on Linux once the release is there: the AppImage under the one name the download buttons
  # point to (releases/latest/download/Twinmap-linux-x86_64.AppImage), then latest-linux.yml, from which the
  # AppImages already on a machine update themselves. Attached after the AppImage, so it never names a file that is
  # not there yet. The release is published already: a Linux build that fails does not take it back.
  linux:
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build the AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npx electron-vite build
          npx electron-builder --linux AppImage --x64 --publish never -c.extraMetadata.version="$VERSION"
      - name: Attach it to the release
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/Twinmap-linux-x86_64.AppImage
          gh release upload "$GITHUB_REF_NAME" dist/latest-linux.yml
