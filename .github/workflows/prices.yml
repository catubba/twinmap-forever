# The prices of the auction houses, once an hour: Blizzard's API to the bucket behind prices.twinmap.app
# (server/prices/prices.ts). Blizzard makes a new snapshot of every house a little after the hour; this runs after it.
# Run every hour at 35 by the Worker of api.twinmap.app (its cron, server/wrangler.toml): GitHub's own schedule never
# ran it. Never on a pull request: a fork must not see the keys.
name: Prices

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server/prices
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node server/prices/prices.ts
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: 8b0e8693c07979b3303d7b5083f5d55a
